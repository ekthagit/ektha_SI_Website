<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In | EVAM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: white;
            border: 1px solid #e7eaf0;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(20, 35, 60, 0.07);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #667085;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dae3;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #2458d3;
            color: white;
            border: 0;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #2458d3;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Welcome back</h1>

        <p>Sign in to your EVAM account.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input
                id="email"
                type="email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="loginButton" type="submit">
                Sign in
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="footer">
            <a href="/forgot-password.html">Forgot password?</a>
            <br><br>
            Don't have an account?
            <a href="/signup.html">Create one</a>
        </div>
    </main>

    <script type="module">
        import { supabase } from "./js/supabase.js";

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Signing in...";

            const email = document
                .getElementById("email")
                .value.trim();

            const password = document
                .getElementById("password")
                .value;

            try {
                const { error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    throw error;
                }

                window.location.assign("/dashboard.html");

            } catch (error) {
                console.error("Login error:", error);

                message.textContent =
                    "Unable to sign in. Check your credentials " +
                    "and email verification status.";

            } finally {
                button.disabled = false;
                button.textContent = "Sign in";
            }
        });
    </script>
</body>
</html>
